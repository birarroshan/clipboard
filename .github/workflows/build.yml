name: Build, Test, and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  build:
    name: Windows Build and Test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        run: |
          $project = [xml](Get-Content src/ClipBoard/ClipBoard.csproj -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore ClipBoard.slnx

      - name: Build
        run: dotnet build ClipBoard.slnx -c Release --no-restore -p:Version=$env:PACKAGE_VERSION

      - name: Test
        run: dotnet test tests/ClipBoard.Tests/ClipBoard.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: |
            TestResults/**/*.trx
            artifacts/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish compressed standalone Windows app
        run: dotnet publish src/ClipBoard/ClipBoard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:PACKAGE_VERSION -o artifacts/publish/win-x64/standalone

      - name: Publish framework-dependent Windows app
        run: dotnet publish src/ClipBoard/ClipBoard.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:PACKAGE_VERSION -o artifacts/publish/win-x64/framework-dependent

      - name: Package app and checksums
        run: |
          New-Item -ItemType Directory -Path artifacts/packages -Force | Out-Null
          foreach ($variant in @('standalone', 'framework-dependent')) {
            $publishPath = "artifacts/publish/win-x64/$variant"
            Copy-Item README.md, LICENSE -Destination $publishPath
            $archive = "artifacts/packages/ClipBoard-$env:PACKAGE_VERSION-win-x64-$variant.zip"
            $executable = "artifacts/packages/ClipBoard-$env:PACKAGE_VERSION-win-x64-$variant.exe"
            Copy-Item "$publishPath/ClipBoard.exe" -Destination $executable
            Compress-Archive -Path "$publishPath/*" -DestinationPath $archive -Force
            foreach ($asset in @($archive, $executable)) {
              $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path $asset -Leaf)" | Set-Content "$asset.sha256" -Encoding ascii
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ClipBoard-win-x64
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ClipBoard-win-x64
          path: release

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = @(foreach ($variant in @('standalone', 'framework-dependent')) {
            foreach ($extension in @('exe', 'zip', 'exe.sha256', 'zip.sha256')) {
              $asset = "release/ClipBoard-$version-win-x64-$variant.$extension"
              if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
              (Get-Item $asset).FullName
            }
          })
          $existing = gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published. Use a new version tag instead of replacing its assets.'
            }
            gh release upload "$env:RELEASE_TAG" @assets --clobber
          } else {
            gh release create "$env:RELEASE_TAG" @assets --verify-tag --draft --generate-notes --title "ClipBoard $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the draft release.' }
