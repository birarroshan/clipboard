name: Build, Test, and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  build:
    name: Windows Build and Test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        run: |
          $project = [xml](Get-Content src/ClipBoard/ClipBoard.csproj -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore ClipBoard.slnx

      - name: Build
        run: dotnet build ClipBoard.slnx -c Release --no-restore -p:Version=$env:PACKAGE_VERSION

      - name: Test
        run: dotnet test tests/ClipBoard.Tests/ClipBoard.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: |
            TestResults/**/*.trx
            artifacts/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish compressed standalone Windows apps
        run: |
          foreach ($architecture in @('x64', 'x86')) {
            dotnet publish src/ClipBoard/ClipBoard.csproj -c Release -r "win-$architecture" --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:PACKAGE_VERSION -o "artifacts/publish/win-$architecture/standalone"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $architecture." }
          }

      - name: Build Windows installers
        run: |
          $installerSource = "installer/ClipBoardInstaller.iss"
          $installerOutput = "artifacts/packages"
          if (-not (Test-Path $installerSource -PathType Leaf)) {
            throw "Missing installer script: $installerSource"
          }
          $compilerPaths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
          $innoCompiler = $compilerPaths | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $innoCompiler) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $innoCompiler = $compilerPaths | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $innoCompiler) { throw 'Inno Setup 6 compiler not found.' }
          foreach ($architecture in @('x64', 'x86')) {
            $publishPath = "artifacts/publish/win-$architecture/standalone"
            & $innoCompiler "/DAppSourceDir=$PWD\$publishPath" "/DOutputDir=$PWD\$installerOutput" "/DAppVersion=$env:PACKAGE_VERSION" "/DAppArchitecture=$architecture" $installerSource
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed for $architecture." }
          }

      - name: Package app and checksums
        run: |
          New-Item -ItemType Directory -Path artifacts/packages -Force | Out-Null
          foreach ($architecture in @('x64', 'x86')) {
            $publishPath = "artifacts/publish/win-$architecture/standalone"
            Copy-Item README.md, LICENSE -Destination $publishPath
            New-Item -ItemType Directory -Path "$publishPath/assets/branding" -Force | Out-Null
            Copy-Item assets/branding/ClipStack-wordmark.png -Destination "$publishPath/assets/branding"
            $archive = "artifacts/packages/ClipStack-$env:PACKAGE_VERSION-win-$architecture-standalone.zip"
            $installer = "artifacts/packages/ClipStack-$env:PACKAGE_VERSION-win-$architecture-setup.exe"
            if (-not (Test-Path $installer -PathType Leaf)) { throw "Missing installer asset: $installer" }
            Compress-Archive -Path "$publishPath/ClipStack.exe", "$publishPath/README.md", "$publishPath/LICENSE", "$publishPath/assets" -DestinationPath $archive -Force
            foreach ($asset in @($archive, $installer)) {
              $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path $asset -Leaf)" | Set-Content "$asset.sha256" -Encoding ascii
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ClipStack-Windows
          path: |
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x64-setup.exe
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x64-setup.exe.sha256
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x64-standalone.zip
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x64-standalone.zip.sha256
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x86-setup.exe
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x86-setup.exe.sha256
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x86-standalone.zip
            artifacts/packages/ClipStack-${{ env.PACKAGE_VERSION }}-win-x86-standalone.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ClipStack-Windows
          path: release

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = @(foreach ($architecture in @('x64', 'x86')) {
            foreach ($suffix in @('setup.exe', 'setup.exe.sha256', 'standalone.zip', 'standalone.zip.sha256')) {
              $asset = "release/ClipStack-$version-win-$architecture-$suffix"
              if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
              (Get-Item $asset).FullName
            }
          })
          $existing = gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published. Use a new version tag instead of replacing its assets.'
            }
            gh release upload "$env:RELEASE_TAG" @assets --clobber
          } else {
            gh release create "$env:RELEASE_TAG" @assets --verify-tag --draft --generate-notes --title "ClipStack $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the draft release.' }
